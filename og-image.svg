<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#12784a"/>
      <stop offset="70%" stop-color="#0a5230"/>
      <stop offset="100%" stop-color="#052a17"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#e8c86a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="tileFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="55%" stop-color="#f9f5ea"/>
      <stop offset="100%" stop-color="#f0ebda"/>
    </linearGradient>
    <filter id="tileShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <g id="floatTile">
      <rect x="2" y="3" width="54" height="72" rx="7" fill="#d8d2bd"/>
      <rect x="0" y="0" width="54" height="72" rx="7" fill="url(#tileFace)" stroke="#cbc5ae" stroke-width="1.5"/>
    </g>
    <!-- 筒（錢幣圓點）：沿用遊戲內 coin() 的分層畫法，rim/main/cream/inner
         四層；縮小尺寸（原本 r=10 在小張的飄浮牌上顯得太大） -->
    <g id="coinBlue">
      <circle r="7" fill="#123f70"/><circle r="6" fill="#2166b0"/>
      <circle r="3.2" fill="#f7f4ea"/><circle r="1.8" fill="#2166b0"/>
    </g>
    <g id="coinGreen">
      <circle r="7" fill="#0f4a2b"/><circle r="6" fill="#1f8a4c"/>
      <circle r="3.2" fill="#f7f4ea"/><circle r="1.8" fill="#1f8a4c"/>
    </g>
    <g id="coinRed">
      <circle r="7" fill="#7d2018"/><circle r="6" fill="#c0392b"/>
      <circle r="3.2" fill="#f7f4ea"/><circle r="1.8" fill="#c0392b"/>
    </g>
    <!-- 索（竹節）：直接照遊戲內 bambooStick() 的畫法等比縮小——三節束腰
         （每節上下端內縮、中間外擴）＋兩條節環線＋中央亮面直條＋頂端
         紅點，不是隨便湊的簡化造型 -->
    <g id="bambooGreen">
      <path d="M -3.5 -10.5 C -2.8 -8.05 -2.8 -5.95 -3.5 -3.5 L 3.5 -3.5 C 2.8 -5.95 2.8 -8.05 3.5 -10.5 Z" fill="#1f8a4c" stroke="#0f4a2b" stroke-width="0.7"/>
      <path d="M -3.5 -3.5 C -2.8 -1.05 -2.8 1.05 -3.5 3.5 L 3.5 3.5 C 2.8 1.05 2.8 -1.05 3.5 -3.5 Z" fill="#1f8a4c" stroke="#0f4a2b" stroke-width="0.7"/>
      <path d="M -3.5 3.5 C -2.8 5.95 -2.8 8.05 -3.5 10.5 L 3.5 10.5 C 2.8 8.05 2.8 5.95 3.5 3.5 Z" fill="#1f8a4c" stroke="#0f4a2b" stroke-width="0.7"/>
      <line x1="-4" y1="-3.5" x2="4" y2="-3.5" stroke="#0f4a2b" stroke-width="1"/>
      <line x1="-4" y1="3.5" x2="4" y2="3.5" stroke="#0f4a2b" stroke-width="1"/>
      <rect x="-1" y="-9.5" width="1.4" height="19" rx="0.7" fill="#5cc585" opacity=".5"/>
      <circle cx="0" cy="-12" r="1.8" fill="#c0392b"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 飄浮麻將牌背景裝飾（呼應大廳頁的漂浮牌動畫，取靜態的某一幀）。
       內容跟畫法都對照遊戲實際牌面：筒＝分層圓點、索＝竹節、萬＝數字＋
       萬字兩色（數字藍／萬字紅，字級相近，不是一大一小），字牌＝單一
       大字（發綠／中紅），不再是空白牌背或憑空捏造的樣式。 -->
  <g opacity=".22">
    <!-- 四筒 -->
    <g transform="translate(140,60) rotate(-12)">
      <use href="#floatTile"/>
      <use href="#coinBlue" x="19" y="24"/><use href="#coinBlue" x="35" y="24"/>
      <use href="#coinBlue" x="19" y="48"/><use href="#coinBlue" x="35" y="48"/>
    </g>
    <!-- 中 -->
    <g transform="translate(480,30) rotate(8)">
      <use href="#floatTile"/>
      <text x="27" y="50" font-family="'Noto Serif TC',serif" font-size="38" font-weight="900" fill="#c0392b" text-anchor="middle">中</text>
    </g>
    <!-- 三索：三支牌沿對角線排列（對照 pipLayout(3) 是左上→中央→右下的
         對角線，上次寫成左上→中右→左下的鋸齒形是錯的） -->
    <g transform="translate(640,470) rotate(-6)">
      <use href="#floatTile"/>
      <use href="#bambooGreen" x="17" y="19"/><use href="#bambooGreen" x="27" y="36"/><use href="#bambooGreen" x="37" y="53"/>
    </g>
    <!-- 五萬 -->
    <g transform="translate(60,430) rotate(10)">
      <use href="#floatTile"/>
      <text x="27" y="32" font-family="'Noto Serif TC',serif" font-size="20" font-weight="800" fill="#1f5fa8" text-anchor="middle">五</text>
      <text x="27" y="58" font-family="'Noto Serif TC',serif" font-size="21" font-weight="800" fill="#c0392b" text-anchor="middle">萬</text>
    </g>
    <!-- 發 -->
    <g transform="translate(1080,470) rotate(-14)">
      <use href="#floatTile"/>
      <text x="27" y="50" font-family="'Noto Serif TC',serif" font-size="38" font-weight="900" fill="#1e7a45" text-anchor="middle">發</text>
    </g>
    <!-- 六筒 -->
    <g transform="translate(30,230) rotate(6)">
      <use href="#floatTile"/>
      <use href="#coinGreen" x="19" y="18"/><use href="#coinGreen" x="35" y="18"/>
      <use href="#coinRed" x="19" y="36"/><use href="#coinRed" x="35" y="36"/>
      <use href="#coinBlue" x="19" y="54"/><use href="#coinBlue" x="35" y="54"/>
    </g>
    <!-- 二索 -->
    <g transform="translate(760,60) rotate(-9)">
      <use href="#floatTile"/>
      <use href="#bambooGreen" x="20" y="24"/><use href="#bambooGreen" x="34" y="48"/>
    </g>
  </g>

  <!-- 雙線裱框，呼應遊戲介面的邊框設計 -->
  <rect x="28" y="28" width="1144" height="574" rx="18" fill="none" stroke="rgba(232,200,106,.28)" stroke-width="2"/>

  <!-- 三張立體斜置麻將牌裝飾（右側）：字級跟顏色比照遊戲實際牌面
       （honor-face 1.7em 大字；wan-face 數字與萬字字級相近，數字藍
       萬字紅）並加上底層厚度色塊＋投影營造立體感 -->
  <g transform="translate(870,190) rotate(-8)" filter="url(#tileShadow)">
    <rect x="5" y="7" width="128" height="172" rx="12" fill="#d8d2bd"/>
    <rect x="0" y="0" width="128" height="172" rx="12" fill="url(#tileFace)" stroke="#cec8b1" stroke-width="2"/>
    <text x="64" y="118" font-family="'Noto Serif TC', serif" font-size="92" font-weight="900" fill="#1e7a45" text-anchor="middle">發</text>
  </g>
  <g transform="translate(960,215) rotate(6)" filter="url(#tileShadow)">
    <rect x="5" y="7" width="128" height="172" rx="12" fill="#d8d2bd"/>
    <rect x="0" y="0" width="128" height="172" rx="12" fill="url(#tileFace)" stroke="#cec8b1" stroke-width="2"/>
    <text x="64" y="118" font-family="'Noto Serif TC', serif" font-size="92" font-weight="900" fill="#c0392b" text-anchor="middle">中</text>
  </g>
  <g transform="translate(915,290) rotate(-2)" filter="url(#tileShadow)">
    <rect x="5" y="7" width="128" height="172" rx="12" fill="#d8d2bd"/>
    <rect x="0" y="0" width="128" height="172" rx="12" fill="url(#tileFace)" stroke="#cec8b1" stroke-width="2"/>
    <text x="64" y="75" font-family="'Noto Serif TC', serif" font-size="56" font-weight="800" fill="#1f5fa8" text-anchor="middle">八</text>
    <text x="64" y="138" font-family="'Noto Serif TC', serif" font-size="60" font-weight="800" fill="#c0392b" text-anchor="middle">萬</text>
  </g>

  <!-- 主標題 -->
  <text x="90" y="270" font-family="'Noto Serif TC', Georgia, serif" font-size="108" font-weight="900" fill="url(#gold)" letter-spacing="6">台灣麻將</text>
  <rect x="94" y="300" width="360" height="4" fill="url(#gold)" opacity=".8"/>
  <text x="90" y="365" font-family="'Noto Serif TC', Georgia, serif" font-size="40" font-weight="700" fill="#e8c86a" letter-spacing="3">十六張 · 連線對戰</text>

  <text x="90" y="440" font-family="'PingFang TC','Microsoft JhengHei',sans-serif" font-size="30" fill="#cfe6d8">P2P 連線 · 電腦補位 · 免安裝，開房即玩</text>

  <!-- CTA -->
  <rect x="90" y="480" width="300" height="70" rx="14" fill="url(#gold)"/>
  <text x="240" y="525" font-family="'PingFang TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="700" fill="#4a3800" text-anchor="middle">立即開房遊玩</text>

  <text x="90" y="590" font-family="'PingFang TC','Microsoft JhengHei',sans-serif" font-size="22" fill="rgba(207,230,216,.6)">7uuuuuuutw.github.io/taiwan-mahjong</text>
</svg>
