<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#12784a"/>
      <stop offset="70%" stop-color="#0a5230"/>
      <stop offset="100%" stop-color="#052a17"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#e8c86a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="tileFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="55%" stop-color="#f9f5ea"/>
      <stop offset="100%" stop-color="#f0ebda"/>
    </linearGradient>
    <filter id="tileShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <g id="floatTile">
      <rect x="2" y="3" width="54" height="72" rx="7" fill="#d8d2bd"/>
      <rect x="0" y="0" width="54" height="72" rx="7" fill="url(#tileFace)" stroke="#cbc5ae" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 飄浮麻將牌背景裝飾（呼應大廳頁的漂浮牌動畫，這裡取靜態的某一幀），
       每張牌面都帶一點內容（花色/數字），不是空白牌背 -->
  <g opacity=".2">
    <g transform="translate(140,60) rotate(-12)">
      <use href="#floatTile"/>
      <circle cx="18" cy="24" r="6" fill="#1f5fa8"/><circle cx="36" cy="24" r="6" fill="#1f5fa8"/>
      <circle cx="18" cy="46" r="6" fill="#1f5fa8"/><circle cx="36" cy="46" r="6" fill="#1f5fa8"/>
    </g>
    <g transform="translate(480,30) rotate(8)">
      <use href="#floatTile"/>
      <text x="27" y="46" font-family="'Noto Serif TC',serif" font-size="30" font-weight="900" fill="#c0392b" text-anchor="middle">中</text>
    </g>
    <g transform="translate(640,470) rotate(-6)">
      <use href="#floatTile"/>
      <circle cx="27" cy="20" r="6" fill="#1e7a45"/><circle cx="27" cy="36" r="6" fill="#c0392b"/><circle cx="27" cy="52" r="6" fill="#1f5fa8"/>
    </g>
    <g transform="translate(60,430) rotate(10)">
      <use href="#floatTile"/>
      <text x="27" y="30" font-family="Georgia,serif" font-size="16" font-weight="900" fill="#1f5fa8" text-anchor="middle">五</text>
      <text x="27" y="58" font-family="'Noto Serif TC',serif" font-size="22" font-weight="900" fill="#1f5fa8" text-anchor="middle">萬</text>
    </g>
    <g transform="translate(1080,470) rotate(-14)">
      <use href="#floatTile"/>
      <text x="27" y="46" font-family="'Noto Serif TC',serif" font-size="30" font-weight="900" fill="#1e7a45" text-anchor="middle">發</text>
    </g>
    <g transform="translate(30,230) rotate(6)">
      <use href="#floatTile"/>
      <circle cx="18" cy="20" r="5" fill="#c0392b"/><circle cx="36" cy="20" r="5" fill="#c0392b"/>
      <circle cx="18" cy="36" r="5" fill="#c0392b"/><circle cx="36" cy="36" r="5" fill="#c0392b"/>
      <circle cx="18" cy="52" r="5" fill="#c0392b"/><circle cx="36" cy="52" r="5" fill="#c0392b"/>
    </g>
    <g transform="translate(760,60) rotate(-9)">
      <use href="#floatTile"/>
      <text x="27" y="30" font-family="Georgia,serif" font-size="16" font-weight="900" fill="#1e7a45" text-anchor="middle">九</text>
      <text x="27" y="58" font-family="'Noto Serif TC',serif" font-size="22" font-weight="900" fill="#1e7a45" text-anchor="middle">索</text>
    </g>
  </g>

  <!-- 雙線裱框，呼應遊戲介面的邊框設計 -->
  <rect x="28" y="28" width="1144" height="574" rx="18" fill="none" stroke="rgba(232,200,106,.28)" stroke-width="2"/>

  <!-- 三張立體斜置麻將牌裝飾（右側）：每張都有底層厚度色塊＋投影，
       呈現立體感，不是純平面色塊 -->
  <g transform="translate(870,190) rotate(-8)" filter="url(#tileShadow)">
    <rect x="5" y="7" width="128" height="172" rx="12" fill="#d8d2bd"/>
    <rect x="0" y="0" width="128" height="172" rx="12" fill="url(#tileFace)" stroke="#cec8b1" stroke-width="2"/>
    <text x="64" y="107" font-family="'Noto Serif TC', Georgia, serif" font-size="60" font-weight="900" fill="#1e7a45" text-anchor="middle">發</text>
  </g>
  <g transform="translate(960,215) rotate(6)" filter="url(#tileShadow)">
    <rect x="5" y="7" width="128" height="172" rx="12" fill="#d8d2bd"/>
    <rect x="0" y="0" width="128" height="172" rx="12" fill="url(#tileFace)" stroke="#cec8b1" stroke-width="2"/>
    <text x="64" y="106" font-family="'Noto Serif TC', Georgia, serif" font-size="58" font-weight="900" fill="#c0392b" text-anchor="middle">中</text>
  </g>
  <g transform="translate(915,290) rotate(-2)" filter="url(#tileShadow)">
    <rect x="5" y="7" width="128" height="172" rx="12" fill="#d8d2bd"/>
    <rect x="0" y="0" width="128" height="172" rx="12" fill="url(#tileFace)" stroke="#cec8b1" stroke-width="2"/>
    <text x="64" y="72" font-family="'Noto Serif TC', serif" font-size="34" font-weight="900" fill="#1f5fa8" text-anchor="middle">八</text>
    <text x="64" y="130" font-family="'Noto Serif TC', serif" font-size="50" font-weight="900" fill="#1f5fa8" text-anchor="middle">萬</text>
  </g>

  <!-- 主標題 -->
  <text x="90" y="270" font-family="'Noto Serif TC', Georgia, serif" font-size="108" font-weight="900" fill="url(#gold)" letter-spacing="6">台灣麻將</text>
  <rect x="94" y="300" width="360" height="4" fill="url(#gold)" opacity=".8"/>
  <text x="90" y="365" font-family="'Noto Serif TC', Georgia, serif" font-size="40" font-weight="700" fill="#e8c86a" letter-spacing="3">十六張 · 連線對戰</text>

  <text x="90" y="440" font-family="'PingFang TC','Microsoft JhengHei',sans-serif" font-size="30" fill="#cfe6d8">P2P 連線 · 電腦補位 · 免安裝，開房即玩</text>

  <!-- CTA -->
  <rect x="90" y="480" width="300" height="70" rx="14" fill="url(#gold)"/>
  <text x="240" y="525" font-family="'PingFang TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="700" fill="#4a3800" text-anchor="middle">立即開房遊玩</text>

  <text x="90" y="590" font-family="'PingFang TC','Microsoft JhengHei',sans-serif" font-size="22" fill="rgba(207,230,216,.6)">7uuuuuuutw.github.io/taiwan-mahjong</text>
</svg>
